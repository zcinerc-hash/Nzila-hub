# ==========================================
# NGINX PWA CONFIGURATION
# ==========================================

# Upstream backend
upstream backend {
    server backendonline-production-ecab.up.railway.app;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/your-cert.crt;
    ssl_certificate_key /etc/ssl/private/your-key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.html;

    # ==========================================
    # GZIP Compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/manifest+json;

    # ==========================================
    # Service Worker - NUNCA cache
    # ==========================================
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ==========================================
    # Manifest - cache curto
    # ==========================================
    location = /manifest.json {
        add_header Cache-Control "max-age=3600, public";
        add_header Content-Type "application/manifest+json";
    }

    # ==========================================
    # PWA Installer - cache curto
    # ==========================================
    location = /pwa-installer.js {
        add_header Cache-Control "max-age=3600, public";
    }

    # ==========================================
    # HTML - cache curto
    # ==========================================
    location ~ \.html?$ {
        add_header Cache-Control "max-age=3600, must-revalidate, public";
    }

    # ==========================================
    # CSS e JS - cache longo
    # ==========================================
    location ~ \.(css|js)$ {
        add_header Cache-Control "max-age=31536000, immutable, public";
    }

    # ==========================================
    # Imagens e Fontes - cache muito longo
    # ==========================================
    location ~ \.(jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg|eot)$ {
        add_header Cache-Control "max-age=31536000, immutable, public";
    }

    # ==========================================
    # Security Headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self';" always;

    # ==========================================
    # API Proxy
    # ==========================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # Fallback para SPA
    # ==========================================
    try_files $uri $uri/ /index.html;

    # ==========================================
    # Logs
    # ==========================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
